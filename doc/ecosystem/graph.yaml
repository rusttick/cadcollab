# Ecosystem relationship graph — Stage 3 full extraction
#
# Produced per doc/ecosystem_relationship_mapping_plan.md. Stage 1 (pilot)
# covered the pieterhijma cluster, FreePDM, openPLM, Ondsel/Lens, and a
# lighter pass on the alekssadowski95 cluster — see
# doc/ecosystem_relationship_mapping_results.md for that history. Stage 3
# extends the pilot to the full census (freecad_pdm_plm_ecosystem_census.md
# + freecad_core_and_lens_collaboration_issues.md), section by section.
# Stub-level facet treatment (mostly `unknown`) is used for single-commit
# scaffolds and ruled-out/unresolved leads, per the plan's "Open Questions"
# recommendation — full treatment for anything with real write-up.
#
# Every fact here is a pointer into the census docs — see `source_doc` /
# `source` fields. Do not treat this file as a substitute for the prose; it
# is a structure layered on top of it.
#
# Facet legend: `unknown` is used explicitly rather than omitting a facet.
#
# ---------------------------------------------------------------------------
# Taxonomy v1 — FROZEN 2026-09-13 (Stage 2)
# ---------------------------------------------------------------------------
# This is the authoritative edge-type taxonomy as of the Stage 2 review that
# followed the Stage 1 pilot. It supersedes (but the plan doc's own table is
# kept as historical/pre-freeze context — see
# doc/ecosystem_relationship_mapping_plan.md's "Typed edges" section, which
# is now superseded by this block for the two changes below).
#
# Two changes made at freeze time, both driven directly by pilot findings
# (see ecosystem_relationship_mapping_results.md's "Taxonomy-fit findings"):
#
#   1. NEW edge type `contributes_to` (person -> project): sustained
#      non-authoring involvement — design feedback, advising, attempted-then-
#      abandoned implementation work. Distinct from `same_author` ("created/
#      drives") and `mentors` (GSoC-style guidance, scoped_to a project).
#      Example: person:dan-miel -> project:freepdm.
#
#   2. NEW field `chose_instead` (free text) on `rejected_in_favor_of`, for
#      the case where a project rejects prior art in favor of something
#      bespoke rather than a named competing project. In that case `to` is
#      `null` (not a fabricated project id), `reason` still explains why the
#      prior art was rejected, and `chose_instead` explains what was built
#      instead.
#
# All other edge types, and the general `confidence`/`source` requirement on
# every edge, are unchanged from the plan doc's original taxonomy table:
# same_author, cites_as_prior_art, rejected_in_favor_of, superseded_by,
# independently_reinvents, aware_of_uncoordinated, shares_standard,
# mentors/mentored_by, discussed_in, forked_from/mirror_of, contributes_to.
#
# Frozen for Stage 3 (full extraction pass, below). Not revisited mid-pass.
# ---------------------------------------------------------------------------
#
# NODE TYPE ADDITION — 2026-09-13 (alliance-analysis phase, post-Stage 5)
# ---------------------------------------------------------------------------
# NEW node type `organization`: a company, community association, or
# open-source development firm that is the primary maintaining entity behind
# a project, when authorship is institutional/abstracted rather than
# attributable to a specific named individual (e.g. a project whose commits
# and decisions are made under a firm's name rather than a personal handle).
# Distinct from an `affiliations` string on a `person` node (which records
# that an identified individual works for/with an org) — `organization` is
# for when the org itself, not a person, is the right node to hold the
# authorship/maintenance edge.
#
# `same_author`'s `from` may now be `organization` as well as `person` — no
# new edge type was needed, since "created/drives" already describes the
# relationship correctly once the subject can be collective, not just
# individual. A project may have both a `same_author` edge from an
# `organization` and separate `same_author`/`contributes_to` edges from any
# individual people who are independently identifiable (e.g. named lead
# developers) — the two aren't mutually exclusive.
#
# Organization nodes added so far are stubs: real entities named directly by
# the user in conversation, not yet independently verified against a primary
# source or populated with named lead developers. Marked `confidence:
# unverified` (a new value, distinct from `confirmed`/`inferred`, meaning
# "asserted outside the census docs, not yet checked against one") until a
# verification pass fills them in.
# ---------------------------------------------------------------------------

