  - type: rejected_in_favor_of
    from: project:freepdm
    to: null
    reason: >
      grd examined SnowFS (purpose-built VCS for large binary/3D files) and
      concluded its git-like internals wouldn't suit FCStd's zip-based
      format.
    chose_instead: >
      No specific competing project was adopted; the rejection reinforced
      the pivot already underway toward a bespoke SFTP/filesystem-permission
      approach (Phase 4 below).
    confidence: confirmed
    source: "freecad_pdm_plm_ecosystem_census.md §16.3 (SnowFS entry)"

  - type: rejected_in_favor_of
    from: project:freepdm
    to: null
    reason: >
      grd explicitly rejected OpenPLM's complexity in Phase 1: "I want to
      make a 'poor man's' PDM... I don't care about fancy stuff, such as
      what OpenPLM is about."
    chose_instead: >
      A KISS SVN+SQLite design (itself later abandoned for the bespoke
      filesystem approach in Phase 4 — see the next edge).
    confidence: confirmed
    source: "freecad_pdm_plm_ecosystem_census.md §16.2 Phase 1"

  - type: rejected_in_favor_of
    from: project:freepdm
    to: null
    reason: >
      Phase 4: grd abandoned the SVN/git-as-substrate framing entirely.
      Zolko directly challenged this as wheel-reinvention ("Why don't you
      choose an existing one") and grd's answer was that he needed to
      control filesystem semantics himself, not that any specific competing
      tool was chosen instead.
    chose_instead: >
      A custom SFTP/SSH virtual filesystem with numbered file-revision
      suffixes (blah.FCStd.000, .001, ...) and directory-permission-mode
      tricks (0700 checked-out / 0555 read-only) for check-out/check-in
      semantics.
    confidence: confirmed
    source: "freecad_pdm_plm_ecosystem_census.md §16.2 Phase 4"

