      SECURITY FINDING (2026-09-13, doc/architecture/freecad-cloud-browser-sabi137032.md):
      a source-level read found strong evidence this repo is a
      malware-distribution decoy, not an honest independent project.
      LICENSE still attributes copyright to hitclawagent (the sibling
      repo's author), contradicting this node's own "no visible
      relationship between the authors" note. The README describes
      Google Drive/Dropbox OAuth features that do not exist anywhere in
      the actual source (providers/__init__.py registers only s3/ftp/
      webdav). The README's primary "Download Here" link points not to
      a GitHub Release but to ui/browser-freecad-cloud-v1.9.zip, checked
      into the repo itself; that zip's contents (listed, NOT extracted
      or executed) are Application.bat, an implausibly large lsp.txt,
      lua51.dll, and util64.exe — none of which relate to the Python
      FreeCAD addon visible in the repo's own source tree. Status
      corrected from "active" to "dead" and this security_note added
      accordingly; not independently confirmed via malware scanning or
      detonation. Do not download or run that zip or its contents.
    corrected_status: >
      status was originally "active"; corrected to "dead" given the
      security finding above — the prior label implied a live,
      legitimate tool, which this finding contradicts.

